<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GymTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --void:#0A0A0E; --surface:#151220; --surface-2:#1E1930; --surface-3:#282039;
    --border:rgba(255,255,255,.08);
    --amethyst:#8B5CF6; --amethyst-dim:#5B3FA0; --ultraviolet:#C084FC;
    --mist:#B4AFC4; --mist-dim:#6E687F; --gold:#F0B429; --danger:#F2607A; --green:#34D399;
    --grad: linear-gradient(135deg, #8B5CF6 0%, #C084FC 100%);
    --radius:18px; --radius-sm:14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--void); color:#fff;}
  body{
    font-family:'Inter',system-ui,sans-serif; min-height:100dvh; display:flex; justify-content:center;
    background: radial-gradient(circle at 15% 0%, rgba(139,92,246,.22), transparent 45%),
                radial-gradient(circle at 90% 15%, rgba(192,132,252,.12), transparent 40%), var(--void);
    -webkit-text-size-adjust:100%;
  }
  #app{width:100%; max-width:428px; min-height:100dvh; position:relative; display:flex; flex-direction:column;}
  .hidden{display:none !important;}
  h1,h2,h3{margin:0;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  /* iOS zoom-fix: minden beviteli mezőnek >=16px kell, különben Safari ráugrik a mezőre fókuszáláskor */
  input,textarea,select{font-size:16px;}
  ::-webkit-scrollbar{width:0; height:0;}

  /* ---------- AUTH ---------- */
  #view-auth{flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 26px calc(32px + var(--safe-bottom));}
  .wordmark{font-size:50px; line-height:.9; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .wordmark span{color:var(--mist); -webkit-text-fill-color:var(--mist);}
  .tagline{color:var(--mist); font-size:14.5px; margin:8px 0 34px; line-height:1.5;}
  .authtabs{display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:14px; margin-bottom:22px; border:1px solid var(--border);}
  .authtabs button{flex:1; padding:11px; border:none; border-radius:10px; background:transparent; color:var(--mist); font-weight:600; font-size:14.5px;}
  .authtabs button.active{background:var(--amethyst); color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--mist); margin-bottom:6px; font-weight:600; letter-spacing:.02em;}
  .field input, .field textarea, .field select{width:100%; padding:14px 16px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--border); color:#fff;}
  .field textarea{resize:vertical; min-height:60px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--amethyst); outline-offset:1px; border-color:var(--amethyst);}
  .field.small{margin-bottom:14px;}
  .field.small label{margin-bottom:5px; font-size:11.5px;}
  .btn-primary{width:100%; padding:16px; border:none; border-radius:var(--radius-sm); background:var(--grad); color:#fff; font-weight:700; font-size:15.5px; margin-top:6px; box-shadow:0 8px 24px -8px rgba(139,92,246,.6); min-height:50px;}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5;}
  .authmsg{font-size:13px; color:var(--danger); margin-top:10px; min-height:16px; line-height:1.4;}
  .authmsg.ok{color:var(--gold);}
  .config-warning{background:rgba(242,96,122,.12); border:1px solid rgba(242,96,122,.4); color:#ffb3c1; padding:12px 14px; border-radius:12px; font-size:12.5px; margin-bottom:20px; line-height:1.5;}

  /* ---------- SHELL ---------- */
  #view-main{flex:1; display:flex; flex-direction:column; min-height:100dvh;}
  .topbar{padding:calc(14px + var(--safe-top)) 18px 14px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; background:rgba(10,10,14,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
  .topbar .logo{font-family:'Bebas Neue',sans-serif; font-size:21px; letter-spacing:.04em;}
  .topbar .logo span{color:var(--ultraviolet);}
  .topbar .date{font-size:11px; color:var(--mist); text-align:right;}
  .topbar .right{display:flex; align-items:center; gap:10px;}
  .icon-btn{width:34px; height:34px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--mist); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .icon-btn svg{width:16px; height:16px;}
  #content{flex:1; padding:16px 16px calc(100px + var(--safe-bottom));}
  .bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:428px; display:flex; background:rgba(21,18,32,.94); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:8px 10px calc(8px + var(--safe-bottom)); z-index:10;}
  .bottomnav button{flex:1; background:none; border:none; color:var(--mist-dim); display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 2px; font-size:10.5px; font-weight:600; border-radius:12px; min-height:50px; justify-content:center;}
  .bottomnav button.active{color:var(--ultraviolet);}
  .bottomnav button.addbtn{color:var(--ultraviolet);}
  .bottomnav svg{width:21px; height:21px;}
  .bottomnav .addcircle{width:42px; height:42px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; margin-bottom:2px; box-shadow:0 6px 18px -4px rgba(139,92,246,.7);}
  .bottomnav .addcircle svg{width:20px; height:20px; color:#fff; stroke:#fff;}

  /* ---------- shared ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mist-dim); font-weight:700; margin:22px 0 10px; padding-left:2px;}
  .section-title:first-child{margin-top:0;}
  .section-title-row{display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 10px; padding-left:2px;}
  .section-title-row .section-title{margin:0; padding-left:0;}
  .ef-summary{font-size:11.5px; color:var(--ultraviolet); font-weight:700;}
  .stat-row{display:flex; gap:10px; margin-bottom:6px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .stat .num{font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--ultraviolet);}
  .stat .lbl{font-size:10.5px; color:var(--mist); margin-top:2px;}
  .btn-outline{width:100%; padding:15px; border-radius:14px; border:1.5px dashed var(--amethyst-dim); background:transparent; color:var(--ultraviolet); font-weight:700; font-size:14.5px; margin-top:12px; min-height:50px;}
  .btn-ghost-sm{padding:10px 14px; border-radius:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--mist); font-weight:600; font-size:12.5px; min-height:40px;}
  .btn-danger-sm{padding:10px 14px; border-radius:11px; border:1px solid rgba(242,96,122,.35); background:rgba(242,96,122,.08); color:var(--danger); font-weight:700; font-size:12.5px; min-height:40px;}
  .row-gap{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .back-btn{background:var(--surface); border:1px solid var(--border); color:#fff; width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .back-title{font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.02em; flex:1;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--mist);}
  .empty-state svg{width:38px; height:38px; color:var(--mist-dim); margin-bottom:14px;}
  .empty-state p{font-size:13.5px; line-height:1.55;}

  /* ---------- NAPLÓ (log) ---------- */
  .hist-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .hist-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer; min-height:36px;}
  .hist-head .hname{font-weight:700; font-size:15.5px;}
  .hist-head .hdate{font-size:12px; color:var(--mist); margin-top:3px;}
  .hist-head .hmeta{font-size:11px; color:var(--mist-dim); margin-top:5px;}
  .hist-head .chev{color:var(--mist-dim); font-size:20px; transition:.2s; flex-shrink:0; padding-left:8px;}
  .hist-card.open .chev{transform:rotate(90deg); color:var(--ultraviolet);}
  .hist-detail{margin-top:14px; padding-top:14px; border-top:1px solid var(--border); display:none;}
  .hist-detail.open{display:block;}
  .hist-ex{margin-bottom:14px;}
  .hist-ex:last-child{margin-bottom:0;}
  .hist-ex .exn{font-size:13.5px; font-weight:700; color:var(--ultraviolet); margin-bottom:7px;}
  .hist-set-line{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--mist); display:flex; gap:8px; padding:2px 0;}
  .hist-actions{display:flex; gap:8px; margin-top:16px;}

  /* ---------- ENTRY FORM (a fő funkció) ---------- */
  .ef-toprow{display:grid; grid-template-columns:1fr 1.3fr; gap:10px;}
  .recent-lbl{font-size:11px; color:var(--mist-dim); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; padding-left:2px;}
  .recent-chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin:-2px -2px 0;}
  .recent-chip{flex-shrink:0; background:var(--surface); border:1px solid var(--border); color:var(--mist); font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:20px; white-space:nowrap;}
  .recent-chip:active{background:var(--surface-2);}

  .ex-block{background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; border-left-width:3px; border-left-style:solid;}
  .ex-block-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ex-block-titlewrap{flex:1; min-width:0;}
  .exname-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ex-block-head .exname{font-weight:700; font-size:15.5px;}
  .mg-tag{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:3px 7px; border-radius:6px; flex-shrink:0;}
  .ghost-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:9px;}
  .ghost-chip{background:rgba(139,92,246,.1); border:1px solid rgba(139,92,246,.25); color:var(--mist); font-size:11px; padding:6px 10px; border-radius:10px; font-family:'JetBrains Mono',monospace; line-height:1.4;}
  .ghost-loading{color:var(--mist-dim); font-size:11px; font-style:italic;}
  .copy-last-btn{background:var(--surface-3); color:var(--ultraviolet); border:1px solid var(--amethyst-dim); border-radius:10px; padding:6px 10px; font-size:11px; font-weight:700;}
  .copy-last-btn:active{transform:scale(.97);}
  .rm-block{background:none; border:none; color:var(--mist-dim); font-size:20px; padding:2px 6px; min-width:32px; min-height:32px;}

  .set-col-header{display:grid; grid-template-columns:26px 1fr 14px 1fr 30px; gap:8px; padding:0; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--mist-dim); font-weight:700; text-align:center; margin-top:14px;}
  .set-row{display:grid; grid-template-columns:26px 1fr 14px 1fr 30px; align-items:center; gap:8px; margin-top:8px;}
  .set-row .set-num{width:24px; height:24px; border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--mist); justify-self:center;}
  .input-wrap{position:relative;}
  .set-row input{width:100%; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; padding:12px 4px; border-radius:11px; background:var(--surface); border:1px solid var(--border); color:#fff;}
  .set-row input:focus{outline:2px solid var(--amethyst); outline-offset:0; border-color:var(--amethyst);}
  .set-row .x{color:var(--mist-dim); font-size:13px; text-align:center;}
  .set-row .pr-tag{position:absolute; top:-8px; right:-5px; background:var(--gold); color:#241a02; font-size:9px; font-weight:800; padding:3px 5px; border-radius:6px; display:none; box-shadow:0 2px 6px rgba(0,0,0,.35); letter-spacing:.02em;}
  .set-row .rm-set{background:none; border:none; color:var(--mist-dim); font-size:19px; width:30px; height:30px; justify-self:center;}
  .add-set-link{margin-top:12px; background:none; border:none; color:var(--ultraviolet); font-size:13px; font-weight:700; padding:6px 0; min-height:32px;}

  .extra-toggle{background:none; border:1px dashed var(--border); color:var(--mist); font-size:12.5px; font-weight:600; padding:12px 14px; border-radius:12px; width:100%; text-align:center; margin-top:2px; min-height:46px;}
  .extra-fields{margin-top:14px;}
  .extra-fields.hidden{display:none;}

  /* ---------- picker ---------- */
  .search-box{width:100%; padding:14px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border); color:#fff; margin-bottom:6px;}
  .muscle-group{font-size:11px; color:var(--mist-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin:18px 0 8px;}
  .pick-row{display:flex; align-items:center; justify-content:space-between; padding:15px 16px; background:var(--surface); border-radius:14px; margin-bottom:8px; border:1px solid var(--border);}
  .pick-row span{font-size:14.5px; font-weight:600;}
  .pick-row button{background:var(--amethyst); border:none; color:#fff; width:32px; height:32px; border-radius:9px; font-size:18px; line-height:1; flex-shrink:0;}

  /* ---------- TESTSÚLY ---------- */
  .bw-entry-line{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .bw-entry-line:last-child{border-bottom:none;}
  .bw-entry-line .bwdate{color:var(--mist);}
  .bw-entry-line .bwright{display:flex; align-items:center; gap:10px;}
  .bw-entry-line .bwval{font-family:'JetBrains Mono',monospace; font-weight:700;}
  .bw-delta{font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:6px;}
  .bw-delta.up{color:var(--green); background:rgba(52,211,153,.12);}
  .bw-delta.down{color:var(--danger); background:rgba(242,96,122,.12);}
  .bw-delta.flat{color:var(--mist-dim); background:var(--surface-2);}
  .bw-entry-line .del{background:none; border:none; color:var(--mist-dim); font-size:16px; width:30px; height:30px;}
  .bw-latest{display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
  .bw-latest .num{font-family:'Bebas Neue',sans-serif; font-size:40px; color:var(--ultraviolet); line-height:1;}
  .bw-latest .unit{font-size:14px; color:var(--mist);}
  .bw-latest-lbl{font-size:11.5px; color:var(--mist-dim); margin-bottom:2px;}

  #toast{position:fixed; bottom:calc(94px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-3); border:1px solid var(--border); padding:13px 18px; border-radius:14px; font-size:13.5px; opacity:0; transition:.25s; pointer-events:none; z-index:50; max-width:88%; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <div id="view-auth" class="view">
    <div id="configWarning" class="config-warning hidden">
      ⚠️ Nincs beállítva a Supabase kapcsolat. A fájl tetején (CONFIG rész) írd be a <b>SUPABASE_URL</b> és <b>SUPABASE_ANON_KEY</b> értékeket.
    </div>
    <div class="wordmark">GYM<span>TRACK</span></div>
    <p class="tagline">Naplózd le egyszerűen, mit és mennyit toltál az edzésen.</p>
    <div class="authtabs">
      <button id="tabSignIn" class="active">Bejelentkezés</button>
      <button id="tabSignUp">Regisztráció</button>
    </div>
    <div class="field"><label>E-mail cím</label><input type="email" id="authEmail" placeholder="te@email.hu" autocomplete="email"></div>
    <div class="field"><label>Jelszó</label><input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" id="authSubmit">Bejelentkezés</button>
    <div class="authmsg" id="authMsg"></div>
  </div>

  <div id="view-main" class="view hidden">
    <div class="topbar">
      <div class="logo">GYM<span>TRACK</span></div>
      <div class="right">
        <div class="date" id="topDate"></div>
        <button class="icon-btn" id="signOutBtn" title="Kijelentkezés">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
    <div id="content"></div>
    <nav class="bottomnav">
      <button data-view="log" class="navbtn active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Napló
      </button>
      <button id="navAdd" class="addbtn">
        <span class="addcircle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        Új
      </button>
      <button data-view="weight" class="navbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
        Testsúly
      </button>
    </nav>
  </div>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   CONFIG — csak PUBLISHABLE vagy legacy ANON kulcsot ide!
   SOHA ne a secret / service_role kulcsot.
   ========================================================= */
const SUPABASE_URL = "https://yhovylehsmwcdeianhzx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlob3Z5bGVoc213Y2RlaWFuaHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTc2OTgsImV4cCI6MjEwMjczMzY5OH0.U_RWRAFbIHDM2yEY-nLH5KTMjnBqrfadNNLl42UcQRw";

const CONFIGURED = SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;
let sb = null;
if (CONFIGURED) { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
else { document.getElementById('configWarning').classList.remove('hidden'); }

/* ---------- state ---------- */
let state = { session:null, exercises:[] };
// entryDraft: { editingWorkoutId, date, name, notes, bodyweight, extraOpen, recentPool,
//               blocks:[{exerciseId,exerciseName,muscleGroup,ghostText,ghostBest,lastSets,sets:[{weight,reps}]}] }
let entryDraft = null;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2300); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateShort(iso){ const d=new Date(iso); return d.toLocaleDateString('hu-HU',{month:'short',day:'numeric'}); }
function todayLabel(){ return new Date().toLocaleDateString('hu-HU',{weekday:'long', month:'long', day:'numeric'}); }
function todayInputDate(){ return new Date().toISOString().slice(0,10); }
function dateToTimestamp(dateStr){ return new Date(dateStr + 'T12:00:00').toISOString(); }
function exerciseName(id){ const e = state.exercises.find(x=>x.id===id); return e ? e.name : 'Gyakorlat'; }
function exerciseMuscleGroup(id){ const e = state.exercises.find(x=>x.id===id); return e ? e.muscle_group : 'Egyéb'; }
const MG_PALETTE = ['#8B5CF6','#F0B429','#34D399','#38BDF8','#F2607A','#FB923C','#A3E635','#F472B6','#C084FC'];
function mgColor(mg){
  const key = mg || 'Egyéb';
  let hash = 0; for (let i=0;i<key.length;i++) hash = (hash*31 + key.charCodeAt(i)) >>> 0;
  return MG_PALETTE[hash % MG_PALETTE.length];
}

/* =========================================================
   AUTH
   ========================================================= */
let authMode = 'signin';
$('#tabSignIn').onclick = () => { authMode='signin'; $('#tabSignIn').classList.add('active'); $('#tabSignUp').classList.remove('active'); $('#authSubmit').textContent='Bejelentkezés'; $('#authMsg').textContent=''; };
$('#tabSignUp').onclick = () => { authMode='signup'; $('#tabSignUp').classList.add('active'); $('#tabSignIn').classList.remove('active'); $('#authSubmit').textContent='Fiók létrehozása'; $('#authMsg').textContent=''; };

$('#authSubmit').onclick = async () => {
  if (!CONFIGURED) { toast('Előbb állítsd be a Supabase kulcsokat.'); return; }
  const email = $('#authEmail').value.trim();
  const password = $('#authPassword').value;
  const msg = $('#authMsg');
  msg.className = 'authmsg'; msg.textContent = '';
  if (!email || !password) { msg.textContent = 'Add meg az e-mail címet és a jelszót.'; return; }
  $('#authSubmit').disabled = true;
  try {
    if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) { msg.classList.add('ok'); msg.textContent = 'Sikeres regisztráció! Ha be van kapcsolva az e-mail megerősítés, nézd meg a postaládád, majd jelentkezz be.'; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) { msg.textContent = translateAuthError(e.message); }
  $('#authSubmit').disabled = false;
};
function translateAuthError(m){
  if (/Invalid login credentials/i.test(m)) return 'Hibás e-mail cím vagy jelszó.';
  if (/already registered/i.test(m)) return 'Ez az e-mail cím már regisztrálva van.';
  if (/Password should be/i.test(m)) return 'A jelszónak legalább 6 karakternek kell lennie.';
  return m;
}
if (CONFIGURED) {
  sb.auth.onAuthStateChange((event, session) => { state.session = session; if (session) enterApp(); else showAuth(); });
}
$('#signOutBtn').onclick = async () => {
  if (!confirm('Biztosan kijelentkezel?')) return;
  await sb.auth.signOut();
};
function showAuth(){ $('#view-auth').classList.remove('hidden'); $('#view-main').classList.add('hidden'); }
async function enterApp(){
  $('#view-auth').classList.add('hidden'); $('#view-main').classList.remove('hidden');
  $('#topDate').textContent = todayLabel();
  await loadExercises();
  switchView('log');
}

/* =========================================================
   NAV
   ========================================================= */
$$('.navbtn').forEach(btn => { btn.onclick = () => switchView(btn.dataset.view); });
$('#navAdd').onclick = () => openEntryForm(null);

function switchView(view){
  $$('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'log') renderLog();
  if (view === 'weight') renderWeight();
}

async function loadExercises(){
  const { data, error } = await sb.from('exercises').select('*').order('muscle_group').order('name');
  if (error) { toast('Hiba a gyakorlatok betöltésekor.'); return; }
  state.exercises = data || [];
}

/* =========================================================
   EXERCISE PICKER (reusable)
   ========================================================= */
function openExercisePicker(backFn, onPick){
  const content = $('#content');
  const groups = {};
  state.exercises.forEach(e => { (groups[e.muscle_group] ||= []).push(e); });
  content.innerHTML = `
    <div class="back-row"><button class="back-btn" id="pkBack">←</button><div class="back-title">Gyakorlat választása</div></div>
    <input class="search-box" id="exSearch" placeholder="Keresés a ${state.exercises.length} gyakorlat között…">
    <div id="pickList"></div>
    <button class="btn-outline" id="customExBtn">+ Egyéni gyakorlat hozzáadása</button>
  `;
  $('#pkBack').onclick = backFn;
  $('#customExBtn').onclick = async () => {
    const name = prompt('Gyakorlat neve:');
    if (!name) return;
    const group = prompt('Izomcsoport (pl. Mell, Hát, Comb, Váll, Kar…):', 'Egyéb') || 'Egyéb';
    const { data, error } = await sb.from('exercises').insert({ user_id: state.session.user.id, name, muscle_group: group }).select().single();
    if (error) { toast('Nem sikerült hozzáadni.'); return; }
    state.exercises.push(data);
    onPick(data);
  };
  function renderList(filter=''){
    const pickList = $('#pickList'); pickList.innerHTML = '';
    const f = filter.trim().toLowerCase();
    Object.keys(groups).forEach(g => {
      const items = groups[g].filter(e => e.name.toLowerCase().includes(f));
      if (!items.length) return;
      const h = document.createElement('div'); h.className='muscle-group'; h.textContent=g; pickList.appendChild(h);
      items.forEach(e => {
        const row = document.createElement('div'); row.className='pick-row';
        row.innerHTML = `<span>${e.name}</span><button>+</button>`;
        row.querySelector('button').onclick = () => onPick(e);
        pickList.appendChild(row);
      });
    });
    if (!pickList.children.length) pickList.innerHTML = `<p style="color:var(--mist); font-size:13px; text-align:center; padding:20px;">Nincs találat.</p>`;
  }
  renderList();
  $('#exSearch').oninput = (e) => renderList(e.target.value);
}

/* =========================================================
   NAPLÓ (log/history) — home view
   ========================================================= */
async function renderLog(){
  const content = $('#content');
  content.innerHTML = `<div id="logStats"></div><div class="section-title">Korábbi bejegyzések</div><div id="histList">Betöltés…</div>`;
  renderWeekStats();
  const { data: workouts, error } = await sb.from('workouts')
    .select('*, workout_sets(id,exercise_id,weight,reps,set_number)')
    .eq('user_id', state.session.user.id)
    .order('started_at', { ascending:false })
    .limit(60);
  const listEl = $('#histList');
  if (error) { listEl.innerHTML = '<p style="color:var(--mist)">Hiba történt a betöltés közben.</p>'; return; }
  if (!workouts || !workouts.length) {
    listEl.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/><rect x="2" y="9" width="4" height="6" rx="1"/><rect x="18" y="9" width="4" height="6" rx="1"/><rect x="6" y="10.5" width="3" height="3" rx=".5"/><rect x="15" y="10.5" width="3" height="3" rx=".5"/></svg>
      <p>Még nincs naplózott edzésed.<br>Koppints a lenti <b>Új</b> gombra az elsőhöz!</p></div>`;
    return;
  }
  listEl.innerHTML = '';
  workouts.forEach(w => {
    const sets = w.workout_sets || [];
    const exCount = new Set(sets.map(s=>s.exercise_id)).size;
    const volume = Math.round(sets.reduce((s,x)=> s + x.weight*x.reps, 0)).toLocaleString('hu-HU');
    const card = document.createElement('div'); card.className='hist-card';
    card.innerHTML = `
      <div class="hist-head">
        <div>
          <div class="hname">${w.name}</div>
          <div class="hdate">${fmtDate(w.started_at)}</div>
          <div class="hmeta">${exCount} gyakorlat · ${sets.length} szett · ${volume} kg összterhelés</div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="hist-detail" id="detail-${w.id}"></div>
    `;
    card.querySelector('.hist-head').onclick = () => {
      const open = card.classList.contains('open');
      $$('.hist-card').forEach(c => { c.classList.remove('open'); c.querySelector('.hist-detail').classList.remove('open'); });
      if (!open) { card.classList.add('open'); card.querySelector('.hist-detail').classList.add('open'); renderWorkoutDetail(w, card.querySelector('.hist-detail')); }
    };
    listEl.appendChild(card);
  });
}

async function renderWeekStats(){
  const box = $('#logStats'); if (!box) return;
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const { data: workouts } = await sb.from('workouts').select('id').eq('user_id', state.session.user.id).gte('started_at', weekAgo.toISOString());
  const ids = (workouts||[]).map(w=>w.id);
  let volume = 0;
  if (ids.length) {
    const { data: sets } = await sb.from('workout_sets').select('weight,reps').in('workout_id', ids);
    volume = (sets||[]).reduce((s,x)=> s + x.weight*x.reps, 0);
  }
  box.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num">${ids.length}</div><div class="lbl">Edzés / 7 nap</div></div>
      <div class="stat"><div class="num">${Math.round(volume).toLocaleString('hu-HU')}</div><div class="lbl">kg / 7 nap</div></div>
    </div>
  `;
}

function renderWorkoutDetail(w, detailEl){
  const sets = w.workout_sets || [];
  if (!sets.length) { detailEl.innerHTML = '<p style="color:var(--mist); font-size:13px;">Nincs rögzített szett.</p>'; return; }
  const byExercise = {};
  sets.slice().sort((a,b)=>a.set_number-b.set_number).forEach(s => { (byExercise[s.exercise_id] ||= []).push(s); });
  detailEl.innerHTML = '';
  Object.keys(byExercise).forEach(exId => {
    const block = document.createElement('div'); block.className='hist-ex';
    const lines = byExercise[exId].map(s => `<div class="hist-set-line"><span>Szett ${s.set_number}</span><span>${s.weight} kg × ${s.reps}</span></div>`).join('');
    block.innerHTML = `<div class="exn">${exerciseName(exId)}</div>${lines}`;
    detailEl.appendChild(block);
  });
  const actions = document.createElement('div'); actions.className='hist-actions';
  actions.innerHTML = `<button class="btn-ghost-sm" id="editW-${w.id}">Szerkesztés</button><button class="btn-danger-sm" id="delW-${w.id}">Törlés</button>`;
  detailEl.appendChild(actions);
  $(`#editW-${w.id}`, detailEl).onclick = () => openEntryForm(w);
  $(`#delW-${w.id}`, detailEl).onclick = async () => {
    if (!confirm('Biztosan törlöd ezt az edzést és az összes szettjét?')) return;
    await sb.from('workouts').delete().eq('id', w.id);
    toast('Törölve.');
    renderLog();
  };
}

/* =========================================================
   ÚJ BEJEGYZÉS / SZERKESZTÉS — a fő funkció
   ========================================================= */
function openEntryForm(existingWorkout){
  if (existingWorkout) {
    const sets = (existingWorkout.workout_sets || []).slice().sort((a,b)=>a.set_number-b.set_number);
    const byExercise = {};
    sets.forEach(s => { (byExercise[s.exercise_id] ||= []).push({ weight:s.weight, reps:s.reps }); });
    entryDraft = {
      editingWorkoutId: existingWorkout.id,
      date: existingWorkout.started_at.slice(0,10),
      name: existingWorkout.name,
      notes: existingWorkout.notes || '',
      bodyweight: '',
      extraOpen: !!(existingWorkout.notes),
      recentPool: [],
      blocks: Object.keys(byExercise).map(exId => ({
        exerciseId: exId, exerciseName: exerciseName(exId), muscleGroup: exerciseMuscleGroup(exId),
        ghostText:'', ghostBest:0, lastSets:null, sets: byExercise[exId]
      }))
    };
  } else {
    entryDraft = { editingWorkoutId:null, date: todayInputDate(), name:'Edzés', notes:'', bodyweight:'', extraOpen:false, recentPool:[], blocks: [] };
  }
  renderEntryForm();
  entryDraft.blocks.forEach((b, i) => loadGhostForBlock(i));
  loadRecentPool();
}

function renderEntryForm(){
  const content = $('#content');
  content.innerHTML = `
    <div class="back-row"><button class="back-btn" id="efBack">←</button><div class="back-title">${entryDraft.editingWorkoutId ? 'Bejegyzés szerkesztése' : 'Új bejegyzés'}</div></div>
    <div class="ef-toprow">
      <div class="field small"><label>Dátum</label><input type="date" id="efDate" value="${entryDraft.date}"></div>
      <div class="field small"><label>Edzés neve</label><input type="text" id="efName" value="${entryDraft.name}"></div>
    </div>
    <div class="section-title-row"><div class="section-title">Gyakorlatok</div><span id="efSummary" class="ef-summary"></span></div>
    <div id="efRecentChips"></div>
    <div id="efBlocks"></div>
    <button class="btn-outline" id="efAddEx">+ Gyakorlat hozzáadása</button>
    <div class="section-title">Extra</div>
    <button class="extra-toggle" id="efExtraToggle">${entryDraft.extraOpen ? '− Testsúly / jegyzet elrejtése' : '+ Testsúly / jegyzet hozzáadása'}</button>
    <div class="extra-fields ${entryDraft.extraOpen ? '' : 'hidden'}" id="efExtraFields">
      <div class="field"><label>Testsúlyod ma (kg) — opcionális</label><input type="number" inputmode="decimal" step="0.1" id="efBw" placeholder="pl. 82.4" value="${entryDraft.bodyweight}"></div>
      <div class="field"><label>Jegyzet — opcionális</label><textarea id="efNotes">${entryDraft.notes}</textarea></div>
    </div>
    <button class="btn-primary" id="efSave" style="margin-top:20px;">Mentés</button>
  `;
  $('#efBack').onclick = () => switchView('log');
  $('#efDate').oninput = e => entryDraft.date = e.target.value;
  $('#efName').oninput = e => entryDraft.name = e.target.value;
  $('#efBw').oninput = e => entryDraft.bodyweight = e.target.value;
  $('#efNotes').oninput = e => entryDraft.notes = e.target.value;
  $('#efExtraToggle').onclick = () => {
    entryDraft.extraOpen = !entryDraft.extraOpen;
    $('#efExtraFields').classList.toggle('hidden', !entryDraft.extraOpen);
    $('#efExtraToggle').textContent = entryDraft.extraOpen ? '− Testsúly / jegyzet elrejtése' : '+ Testsúly / jegyzet hozzáadása';
  };
  $('#efAddEx').onclick = () => openExercisePicker(renderEntryForm, addExerciseBlock);
  renderEfBlocks();
  renderRecentChips();
  $('#efSave').onclick = saveEntry;
}

function addExerciseBlock(ex){
  entryDraft.blocks.push({ exerciseId: ex.id, exerciseName: ex.name, muscleGroup: ex.muscle_group, ghostText:'', ghostBest:0, lastSets:null, sets:[{weight:'',reps:''}] });
  renderEntryForm();
  loadGhostForBlock(entryDraft.blocks.length - 1);
}

async function loadRecentPool(){
  const { data } = await sb.from('workout_sets').select('exercise_id,created_at').eq('user_id', state.session.user.id).order('created_at', { ascending:false }).limit(60);
  if (!entryDraft) return;
  const seen = new Set(); const pool = [];
  (data||[]).forEach(row => {
    if (seen.has(row.exercise_id) || pool.length >= 8) return;
    seen.add(row.exercise_id);
    const ex = state.exercises.find(e => e.id === row.exercise_id);
    if (ex) pool.push(ex);
  });
  entryDraft.recentPool = pool;
  renderRecentChips();
}

function renderRecentChips(){
  const box = $('#efRecentChips'); if (!box || !entryDraft) return;
  const usedIds = new Set(entryDraft.blocks.map(b => b.exerciseId));
  const items = (entryDraft.recentPool || []).filter(ex => !usedIds.has(ex.id));
  if (!items.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="recent-lbl">Gyors hozzáadás</div><div class="recent-chip-row">${items.map(ex => `<button class="recent-chip" data-quickadd="${ex.id}">+ ${ex.name}</button>`).join('')}</div>`;
  box.querySelectorAll('[data-quickadd]').forEach(btn => {
    btn.onclick = () => { const ex = state.exercises.find(e => e.id === btn.dataset.quickadd); if (ex) addExerciseBlock(ex); };
  });
}

function ghostActionsHtml(bIdx){
  const block = entryDraft.blocks[bIdx];
  if (!block.ghostText) return '<span class="ghost-loading">Előzmény betöltése…</span>';
  let html = `<span class="ghost-chip">${block.ghostText}</span>`;
  if (block.lastSets && block.lastSets.length) {
    html += `<button class="copy-last-btn" data-copylast="${bIdx}">⚡ Ugyanaz mint legutóbb</button>`;
  }
  return html;
}

function renderEfBlocks(){
  const wrap = $('#efBlocks');
  if (!wrap) return;
  wrap.innerHTML = '';
  if (!entryDraft.blocks.length) {
    wrap.innerHTML = `<p style="color:var(--mist); font-size:13px; padding:6px 2px 4px;">Adj hozzá legalább egy gyakorlatot.</p>`;
    updateEfSummary();
    return;
  }
  entryDraft.blocks.forEach((block, bIdx) => {
    const el = document.createElement('div'); el.className='ex-block'; el.dataset.block = bIdx;
    el.style.borderLeftColor = mgColor(block.muscleGroup);
    el.innerHTML = `
      <div class="ex-block-head">
        <div class="ex-block-titlewrap">
          <div class="exname-row">
            <span class="exname">${block.exerciseName}</span>
            <span class="mg-tag" style="background:${mgColor(block.muscleGroup)}22; color:${mgColor(block.muscleGroup)};">${block.muscleGroup || 'Egyéb'}</span>
          </div>
          <div class="ghost-actions" id="ghostActions-${bIdx}">${ghostActionsHtml(bIdx)}</div>
        </div>
        <button class="rm-block" data-rm-block="${bIdx}">×</button>
      </div>
      <div class="set-col-header"><span></span><span>KG</span><span></span><span>ISM</span><span></span></div>
      <div class="sets-of-block" data-sets="${bIdx}"></div>
      <button class="add-set-link" data-add-set="${bIdx}">+ szett hozzáadása</button>
    `;
    wrap.appendChild(el);
    renderSetRows(bIdx);
  });

  wrap.querySelectorAll('[data-rm-block]').forEach(btn => {
    btn.onclick = () => { entryDraft.blocks.splice(parseInt(btn.dataset.rmBlock),1); renderEfBlocks(); renderRecentChips(); };
  });
  wrap.querySelectorAll('[data-add-set]').forEach(btn => {
    btn.onclick = () => { const b = parseInt(btn.dataset.addSet); entryDraft.blocks[b].sets.push({weight:'',reps:''}); renderSetRows(b); };
  });
  wrap.querySelectorAll('[data-copylast]').forEach(btn => {
    btn.onclick = () => copyLastSets(parseInt(btn.dataset.copylast));
  });
  updateEfSummary();
}

function renderSetRows(bIdx){
  const container = $(`.sets-of-block[data-sets="${bIdx}"]`);
  if (!container) return;
  const block = entryDraft.blocks[bIdx];
  container.innerHTML = '';
  block.sets.forEach((s, sIdx) => {
    const row = document.createElement('div'); row.className='set-row';
    row.innerHTML = `
      <div class="set-num">${sIdx+1}</div>
      <div class="input-wrap">
        <input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${s.weight}" data-w="${bIdx}:${sIdx}">
        <span class="pr-tag" data-pr="${bIdx}:${sIdx}" style="display:${(parseFloat(s.weight)||0) > block.ghostBest ? 'inline-block':'none'}">PR</span>
      </div>
      <span class="x">×</span>
      <input type="number" inputmode="numeric" placeholder="ism." value="${s.reps}" data-r="${bIdx}:${sIdx}">
      <button class="rm-set" data-rmset="${bIdx}:${sIdx}">×</button>
    `;
    container.appendChild(row);
  });
  container.querySelectorAll('[data-w]').forEach(inp => {
    inp.oninput = () => {
      const [b,s] = inp.dataset.w.split(':').map(Number);
      entryDraft.blocks[b].sets[s].weight = inp.value;
      const pr = $(`[data-pr="${b}:${s}"]`, container);
      if (pr) pr.style.display = (parseFloat(inp.value)||0) > entryDraft.blocks[b].ghostBest ? 'inline-block' : 'none';
    };
  });
  container.querySelectorAll('[data-r]').forEach(inp => {
    inp.oninput = () => { const [b,s] = inp.dataset.r.split(':').map(Number); entryDraft.blocks[b].sets[s].reps = inp.value; };
  });
  container.querySelectorAll('[data-rmset]').forEach(btn => {
    btn.onclick = () => { const [b,s] = btn.dataset.rmset.split(':').map(Number); entryDraft.blocks[b].sets.splice(s,1); renderSetRows(b); };
  });
  updateEfSummary();
}

function copyLastSets(bIdx){
  const block = entryDraft.blocks[bIdx];
  if (!block || !block.lastSets || !block.lastSets.length) return;
  const hasData = block.sets.some(s => s.weight !== '' || s.reps !== '');
  if (hasData && !confirm('Ez felülírja a már beírt szetteket ennél a gyakorlatnál. Folytatod?')) return;
  block.sets = block.lastSets.map(s => ({ weight: s.weight, reps: s.reps }));
  renderSetRows(bIdx);
  toast('Kitöltve a legutóbbi adatokkal — még módosíthatod.');
}

function updateEfSummary(){
  const el = $('#efSummary'); if (!el || !entryDraft) return;
  const exCount = entryDraft.blocks.length;
  const setCount = entryDraft.blocks.reduce((s,b) => s + b.sets.length, 0);
  el.textContent = exCount ? `${exCount} gyakorlat · ${setCount} szett` : '';
}

async function loadGhostForBlock(bIdx){
  const block = entryDraft.blocks[bIdx];
  if (!block) return;
  const ghost = await getLastPerformance(block.exerciseId, entryDraft.editingWorkoutId);
  if (!entryDraft.blocks[bIdx]) return; // block may have been removed meanwhile
  if (ghost && ghost.sets.length) {
    entryDraft.blocks[bIdx].ghostText = `👻 Múltkor (${fmtDateShort(ghost.date)}): ${ghost.sets.map(s=>`${s.weight}kg×${s.reps}`).join(', ')}`;
    entryDraft.blocks[bIdx].ghostBest = Math.max(...ghost.sets.map(s=>s.weight));
    entryDraft.blocks[bIdx].lastSets = ghost.sets.map(s => ({ weight:String(s.weight), reps:String(s.reps) }));
  } else {
    entryDraft.blocks[bIdx].ghostText = 'Ez az első alkalom, hogy ezt naplózod.';
    entryDraft.blocks[bIdx].ghostBest = 0;
    entryDraft.blocks[bIdx].lastSets = null;
  }
  const box = $(`#ghostActions-${bIdx}`);
  if (box) {
    box.innerHTML = ghostActionsHtml(bIdx);
    box.querySelectorAll('[data-copylast]').forEach(btn => { btn.onclick = () => copyLastSets(parseInt(btn.dataset.copylast)); });
  }
}

async function getLastPerformance(exerciseId, excludeWorkoutId){
  let q = sb.from('workout_sets').select('workout_id, created_at').eq('user_id', state.session.user.id).eq('exercise_id', exerciseId);
  if (excludeWorkoutId) q = q.neq('workout_id', excludeWorkoutId);
  const { data: prevSetRow } = await q.order('created_at', { ascending:false }).limit(1);
  if (!prevSetRow || !prevSetRow.length) return null;
  const wId = prevSetRow[0].workout_id;
  const { data: sets } = await sb.from('workout_sets').select('weight,reps,set_number').eq('workout_id', wId).eq('exercise_id', exerciseId).order('set_number');
  return { date: prevSetRow[0].created_at, sets: sets || [] };
}

async function saveEntry(){
  if (!entryDraft.date) { toast('Válassz dátumot.'); return; }
  const validBlocks = entryDraft.blocks.map(b => ({
    ...b, sets: b.sets.filter(s => s.weight !== '' && s.reps !== '' && !isNaN(parseFloat(s.weight)) && !isNaN(parseInt(s.reps)))
  })).filter(b => b.sets.length > 0);
  if (!validBlocks.length) { toast('Adj meg legalább egy kitöltött szettet (súly + ismétlés).'); return; }

  $('#efSave').disabled = true; $('#efSave').textContent = 'Mentés…';
  try {
    const ts = dateToTimestamp(entryDraft.date);
    let workoutId = entryDraft.editingWorkoutId;
    if (workoutId) {
      await sb.from('workouts').update({ name: entryDraft.name || 'Edzés', started_at: ts, finished_at: ts, notes: entryDraft.notes || null }).eq('id', workoutId);
      await sb.from('workout_sets').delete().eq('workout_id', workoutId);
    } else {
      const { data, error } = await sb.from('workouts').insert({ user_id: state.session.user.id, name: entryDraft.name || 'Edzés', started_at: ts, finished_at: ts, notes: entryDraft.notes || null }).select().single();
      if (error) throw error;
      workoutId = data.id;
    }

    const rows = [];
    validBlocks.forEach(b => {
      b.sets.forEach((s, i) => {
        rows.push({ workout_id: workoutId, exercise_id: b.exerciseId, user_id: state.session.user.id, set_number: i+1, weight: parseFloat(s.weight), reps: parseInt(s.reps) });
      });
    });
    const { error: setErr } = await sb.from('workout_sets').insert(rows);
    if (setErr) throw setErr;

    if (entryDraft.bodyweight !== '' && !isNaN(parseFloat(entryDraft.bodyweight))) {
      await sb.from('body_weight_logs').upsert(
        { user_id: state.session.user.id, log_date: entryDraft.date, weight_kg: parseFloat(entryDraft.bodyweight) },
        { onConflict: 'user_id,log_date' }
      );
    }
    toast('Bejegyzés elmentve 💪');
    switchView('log');
  } catch (e) {
    toast('Hiba mentés közben: ' + (e.message || 'ismeretlen hiba'));
    $('#efSave').disabled = false; $('#efSave').textContent = 'Mentés';
  }
}

/* =========================================================
   TESTSÚLY
   ========================================================= */
async function renderWeight(){
  const content = $('#content');
  content.innerHTML = `
    <div id="bwLatestBox"></div>
    <div class="section-title">Új mérés</div>
    <div class="card">
      <div class="field"><label>Dátum</label><input type="date" id="bwDate" value="${todayInputDate()}"></div>
      <div class="field"><label>Testsúly (kg)</label><input type="number" inputmode="decimal" step="0.1" id="bwWeight" placeholder="pl. 82.4"></div>
      <button class="btn-primary" id="bwSave">Mentés</button>
    </div>
    <div class="section-title">Korábbi mérések</div>
    <div class="card" id="bwList">Betöltés…</div>
  `;
  $('#bwSave').onclick = async () => {
    const d = $('#bwDate').value; const w = parseFloat($('#bwWeight').value);
    if (!d || isNaN(w)) { toast('Add meg a dátumot és a súlyt.'); return; }
    const { error } = await sb.from('body_weight_logs').upsert({ user_id: state.session.user.id, log_date: d, weight_kg: w }, { onConflict:'user_id,log_date' });
    if (error) { toast('Nem sikerült menteni.'); return; }
    toast('Testsúly mentve.');
    $('#bwWeight').value = '';
    loadBwList();
  };
  loadBwList();
}

async function loadBwList(){
  const box = $('#bwList'); const latestBox = $('#bwLatestBox');
  if (!box) return;
  const { data } = await sb.from('body_weight_logs').select('*').eq('user_id', state.session.user.id).order('log_date', { ascending:false }).limit(20);
  if (latestBox) {
    if (data && data.length) {
      latestBox.innerHTML = `
        <div class="card">
          <div class="bw-latest-lbl">Legutóbbi mérés — ${fmtDate(data[0].log_date)}</div>
          <div class="bw-latest"><span class="num">${data[0].weight_kg}</span><span class="unit">kg</span></div>
        </div>`;
    } else {
      latestBox.innerHTML = '';
    }
  }
  if (!data || !data.length) { box.innerHTML = `<p style="color:var(--mist); font-size:13px;">Még nincs rögzített mérés.</p>`; return; }
  box.innerHTML = '';
  data.forEach((row, i) => {
    const prev = data[i+1]; // egy méréssel korábbi (a lista dátum szerint csökkenő)
    let deltaHtml = '';
    if (prev) {
      const diff = Math.round((row.weight_kg - prev.weight_kg) * 10) / 10;
      const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
      const sign = diff > 0 ? '+' : '';
      deltaHtml = `<span class="bw-delta ${cls}">${sign}${diff} kg</span>`;
    }
    const line = document.createElement('div'); line.className='bw-entry-line';
    line.innerHTML = `<span class="bwdate">${fmtDate(row.log_date)}</span><div class="bwright">${deltaHtml}<span class="bwval mono">${row.weight_kg} kg</span><button class="del" data-bwdel="${row.id}">✕</button></div>`;
    box.appendChild(line);
  });
  box.querySelectorAll('[data-bwdel]').forEach(btn => {
    btn.onclick = async () => { await sb.from('body_weight_logs').delete().eq('id', btn.dataset.bwdel); loadBwList(); };
  });
}

/* ---------- init ---------- */
if (CONFIGURED) {
  sb.auth.getSession().then(({ data }) => { state.session = data.session; if (data.session) enterApp(); else showAuth(); });
} else { showAuth(); }
</script>
